{% extends "base.html" %}

{% block title %}AI Farmer Chatbot{% endblock %}

{% block content %}

<div class="container mt-5">

<div class="card shadow-lg">

<div class="card-header bg-success text-white">

<h3>🤖 AI Farmer Assistant</h3>

</div>

<div class="card-body">

<p class="text-muted">
Ask any farming question.
</p>

<textarea
id="question"
class="form-control"
rows="5"
placeholder="Example: Which fertilizer is best for rice?"></textarea>

<button
class="btn btn-success mt-3"
onclick="askAI()">

Ask AI

</button>

<hr>

<div id="answer" class="mt-3"></div>

</div>

</div>

</div>

<script>

function askAI(){

let q=document.getElementById("question").value;

let ans="";

if(q.toLowerCase().includes("rice")){

ans="🌾 Rice grows well in clay soil. Use NPK fertilizer.";

}

else if(q.toLowerCase().includes("tomato")){

ans="🍅 Tomato requires well-drained soil and regular watering.";

}

else if(q.toLowerCase().includes("fertilizer")){

ans="🌱 Use fertilizer according to your soil test results.";

}

else if(q.toLowerCase().includes("disease")){

ans="🦠 Upload a leaf image to use the Disease Detection module.";

}

else{

ans="🤖 Sorry, I don't have an answer for that question yet.";

}

document.getElementById("answer").innerHTML=

'<div class="alert alert-success">'+ans+'</div>';

}

</script>

{% endblock %}
