{% extends "base.html" %}

{% block title %}Add Diary{% endblock %}

{% block content %}

<div class="container mt-5">

<div class="card shadow">

<div class="card-header bg-success text-white">

<h3>🌱 Crop Diary</h3>

</div>

<div class="card-body">

<form method="POST">

<div class="mb-3">

<label>Crop Name</label>

<input
type="text"
name="crop"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Date</label>

<input
type="date"
name="date"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Fertilizer</label>

<input
type="text"
name="fertilizer"
class="form-control">

</div>

<div class="mb-3">

<label>Irrigation</label>

<input
type="text"
name="irrigation"
class="form-control">

</div>

<div class="mb-3">

<label>Notes</label>

<textarea
name="notes"
class="form-control"
rows="4"></textarea>

</div>

<button
class="btn btn-success">

Save

</button>

</form>

</div>

</div>

</div>

{% endblock %}
