{% extends "base.html" %}

{% block title %}Yield Prediction{% endblock %}

{% block content %}

<div class="container py-5">

<div class="row justify-content-center">

<div class="col-lg-9">

<div class="card shadow-lg border-0">

<div class="card-header bg-warning text-dark text-center">

<h2>📈 AI Yield Prediction</h2>

<p class="mb-0">

Predict Crop Yield & Estimated Income

</p>

</div>

<div class="card-body">

<form id="yieldForm">

<div class="row">

<div class="col-md-6 mb-3">

<label>Crop Type</label>

<select name="crop_type" class="form-control">

<option value="rice">Rice</option>

<option value="wheat">Wheat</option>

<option value="maize">Maize</option>

<option value="cotton">Cotton</option>

<option value="sugarcane">Sugarcane</option>

<option value="vegetables">Vegetables</option>

</select>

</div>

<div class="col-md-6 mb-3">

<label>Area (Acres)</label>

<input type="number" step="0.1" class="form-control" name="area" required>

</div>

<div class="col-md-4 mb-3">

<label>Soil Quality (%)</label>

<input type="number" class="form-control" name="soil_quality">

</div>

<div class="col-md-4 mb-3">

<label>Temperature (°C)</label>

<input type="number" class="form-control" name="temperature">

</div>

<div class="col-md-4 mb-3">

<label>Rainfall (mm)</label>

<input type="number" class="form-control" name="rainfall">

</div>

<div class="col-md-12 mb-3">

<label>Fertilizer Used (kg)</label>

<input type="number" class="form-control" name="fertilizer_used">

</div>

</div>

<div class="d-grid">

<button class="btn btn-warning btn-lg">

📈 Predict Yield

</button>

</div>

</form>

<hr>

<div id="loading"
class="text-center"
style="display:none">

<div class="spinner-border text-warning"></div>

<p class="mt-3">

Calculating...

</p>

</div>

<div id="result"
style="display:none">

<div class="alert alert-success mt-4">

<h3>

Predicted Yield

</h3>

<h2 id="yieldResult"></h2>

<hr>

<h4>

Estimated Income

</h4>

<h2 id="incomeResult"></h2>

<hr>

<h5>

Confidence

</h5>

<h3 id="confidenceResult"></h3>

<hr>

<h5>

Recommendations

</h5>

<p id="recommendationResult"></p>

</div>

</div>

</div>

</div>

</div>

</div>

</div>

<script>

document.getElementById("yieldForm").onsubmit=function(e){

e.preventDefault();

document.getElementById("loading").style.display="block";

document.getElementById("result").style.display="none";

let formData=new FormData(this);

fetch("/yield/api/predict-yield",{

method:"POST",

body:formData

})

.then(r=>r.json())

.then(data=>{

document.getElementById("loading").style.display="none";

document.getElementById("result").style.display="block";

document.getElementById("yieldResult").innerHTML=data.yield+" "+data.unit;

document.getElementById("incomeResult").innerHTML="₹ "+data.income;

document.getElementById("confidenceResult").innerHTML=(data.confidence*100).toFixed(1)+"%";

document.getElementById("recommendationResult").innerHTML=data.recommendations;

});

}

</script>

{% endblock %}
