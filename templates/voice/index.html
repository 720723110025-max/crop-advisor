{% extends "base.html" %}

{% block title %}Voice Assistant{% endblock %}

{% block content %}

<div class="container mt-5">

<div class="card shadow">

<div class="card-header bg-primary text-white">

<h3>

🎙 AI Voice Assistant

</h3>

</div>

<div class="card-body text-center">

<h4 id="status">

Press the button and speak.

</h4>

<button
class="btn btn-primary btn-lg mt-3"
onclick="startListening()">

🎤 Start Speaking

</button>

<hr>

<h5>You Said</h5>

<p id="speech"></p>

<h5>Assistant Reply</h5>

<p id="reply"></p>

</div>

</div>

</div>

<script>

function startListening() {

    if (!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)) {
        alert("Speech Recognition is not supported in this browser.");
        return;
    }

    const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();

    recognition.lang = "en-IN";
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    recognition.start();

    document.getElementById("status").innerHTML = "🎤 Listening...";

    recognition.onresult = function(event) {

        let text = event.results[0][0].transcript;

        document.getElementById("speech").innerHTML = text;

        let reply = "Sorry, I don't understand.";

        text = text.toLowerCase();

        if (text.includes("weather")) {
            reply = "Today's weather is cloudy with chances of rain.";
        }
        else if (text.includes("crop")) {
            reply = "Rice is recommended for loamy soil with proper irrigation.";
        }
        else if (text.includes("disease")) {
            reply = "Please upload a leaf image in Disease Detection to identify crop disease.";
        }
        else if (text.includes("fertilizer")) {
            reply = "Use fertilizer based on your soil analysis report.";
        }
        else if (text.includes("soil")) {
            reply = "Loamy soil is suitable for most crops.";
        }
        else if (text.includes("market")) {
            reply = "Current paddy market price is around ₹2450 per quintal.";
        }
        else if (text.includes("yield")) {
            reply = "Use the Yield Prediction module to estimate crop production.";
        }
        else if (text.includes("hello") || text.includes("hi")) {
            reply = "Hello! How can I help you today?";
        }

        document.getElementById("reply").innerHTML = reply;

        const speech = new SpeechSynthesisUtterance(reply);
        speech.lang = "en-IN";
        window.speechSynthesis.speak(speech);

        document.getElementById("status").innerHTML = "✅ Completed";
    };

    recognition.onerror = function() {
        document.getElementById("status").innerHTML = "❌ Voice recognition failed.";
    };

}

</script>

{% endblock %}
