{% extends "base.html" %}

{% block title %}Login - Crop Advisory System{% endblock %}

{% block content %}

<style>
body{
    background: linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.45)),
    url("https://images.unsplash.com/photo-1464226184884-fa280b87c399?w=1600");
    background-size:cover;
    background-position:center;
}

.login-card{
    max-width:420px;
    margin:auto;
    margin-top:60px;
    background:rgba(255,255,255,.15);
    backdrop-filter:blur(12px);
    border-radius:20px;
    padding:35px;
    color:white;
    box-shadow:0 10px 30px rgba(0,0,0,.35);
}

.form-control{
    border-radius:12px;
    height:48px;
}

.btn-login{
    border-radius:12px;
    font-weight:bold;
    transition:.3s;
}

.btn-login:hover{
    transform:scale(1.05);
}

.logo{
    font-size:60px;
}

a{
    color:#fff;
}

a:hover{
    color:#ffc107;
}
</style>

<div class="container">

<div class="login-card">

<div class="text-center">

<div class="logo">
🌿
</div>

<h2 class="fw-bold">
Crop Advisory System
</h2>

<p>
AI Powered Smart Farming
</p>

</div>

<form method="POST" action="{{ url_for('auth.login') }}">

{{ form.hidden_tag() if form }}

<div class="mb-3">

<label>Email</label>

<input
type="email"
name="email"
class="form-control"
placeholder="Enter Email"
required>

</div>

<div class="mb-3">

<label>Password</label>

<div class="input-group">

<input
type="password"
name="password"
id="password"
class="form-control"
placeholder="Enter Password"
required>

<button
class="btn btn-light"
type="button"
onclick="togglePassword()">

👁

</button>

</div>

</div>

<div class="form-check mb-3">

<input
class="form-check-input"
type="checkbox">

<label class="form-check-label">

Remember Me

</label>

</div>

<button
class="btn btn-success w-100 btn-login">

Login

</button>

<div class="text-center mt-3">

<a href="{{ url_for('auth.register') }}">

Create Account

</a>

</div>

</form>

</div>

</div>

<script>

function togglePassword(){

let x=document.getElementById("password");

if(x.type==="password"){

x.type="text";

}else{

x.type="password";

}

}

</script>

{% endblock %}
