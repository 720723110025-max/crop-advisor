{% extends "base.html" %}

{% block title %}Market Prices{% endblock %}

{% block content %}

<div class="container mt-5">

<h2>💰 Market Prices</h2>

<input
id="searchCrop"
class="form-control mb-3"
placeholder="Search Crop">

<table class="table table-striped">

<thead class="table-success">

<tr>

<th>Crop</th>

<th>Market</th>

<th>Price</th>

</tr>

</thead>

<tbody id="marketTable">

{% for item in prices %}

<tr>

<td>{{ item.crop }}</td>

<td>{{ item.market }}</td>

<td>{{ item.price }}</td>

</tr>

{% endfor %}

</tbody>

</table>

</div>

<script>

document.getElementById("searchCrop")
.onkeyup=function(){

let value=this.value.toLowerCase();

document.querySelectorAll("#marketTable tr")
.forEach(row=>{

row.style.display=row.innerText
.toLowerCase()
.includes(value)
? ""
: "none";

});

};

</script>

{% endblock %}
