{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

<h2>Add Expert</h2>

<form method="POST">

<div class="mb-3">
<label>Name</label>
<input name="name" class="form-control">
</div>

<div class="mb-3">
<label>District</label>
<input name="district" class="form-control">
</div>

<div class="mb-3">
<label>Specialization</label>
<input name="specialization" class="form-control">
</div>

<div class="mb-3">
<label>Phone</label>
<input name="phone" class="form-control">
</div>

<div class="mb-3">
<label>Email</label>
<input name="email" class="form-control">
</div>

<button class="btn btn-primary">
Add Expert
</button>

</form>

</div>

{% endblock %}
