{% extends "base.html" %}

{% block title %}
Add Expert
{% endblock %}

{% block content %}

<div class="container mt-5">

<div class="card shadow">

<div class="card-header bg-success text-white">

<h3>👨‍🏫 Add Agricultural Expert</h3>

</div>

<div class="card-body">

<form method="POST" enctype="multipart/form-data">

<div class="row">

<div class="col-md-6 mb-3">

<label class="form-label">Full Name</label>

<input
type="text"
name="name"
class="form-control"
required>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">Username</label>

<input
type="text"
name="username"
class="form-control"
required>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">Password</label>

<input
type="password"
name="password"
class="form-control"
required>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">District</label>

<input
type="text"
name="district"
class="form-control"
required>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">Specialization</label>

<select
name="specialization"
class="form-select">

<option>Paddy</option>

<option>Maize</option>

<option>Cotton</option>

<option>Vegetables</option>

<option>Soil Health</option>

<option>Plant Disease</option>

<option>Organic Farming</option>

</select>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">Languages</label>

<input
type="text"
name="languages"
class="form-control"
placeholder="Tamil, English">

</div>

<div class="col-md-6 mb-3">

<label class="form-label">Experience (Years)</label>

<input
type="number"
name="experience"
class="form-control">

</div>

<div class="col-md-6 mb-3">

<label class="form-label">Availability</label>

<select
name="availability"
class="form-select">

<option>Available</option>

<option>Busy</option>

<option>Offline</option>

</select>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">Phone</label>

<input
type="text"
name="phone"
class="form-control">

</div>

<div class="col-md-6 mb-3">

<label class="form-label">Email</label>

<input
type="email"
name="email"
class="form-control">

</div>

<div class="col-md-12 mb-3">

<label class="form-label">Profile Photo</label>

<input
type="file"
name="photo"
class="form-control">

</div>

</div>

<div class="mt-3">

<button
type="submit"
class="btn btn-success">

➕ Create Expert

</button>

<a
href="{{ url_for('expert.index') }}"
class="btn btn-secondary">

Cancel

</a>

</div>

</form>

</div>

</div>

</div>

{% endblock %}
