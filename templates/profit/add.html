{% extends "base.html" %}

{% block title %}Add Profit{% endblock %}

{% block content %}

<div class="container mt-5">

<div class="card shadow">

<div class="card-header bg-success text-white">

<h3>💰 Profit Calculator</h3>

</div>

<div class="card-body">

<form method="POST">

<div class="mb-3">

<label>Crop</label>

<input
type="text"
name="crop"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Production (Quintals)</label>

<input
type="number"
step="0.01"
name="quantity"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Total Expense</label>

<input
type="number"
step="0.01"
name="expense"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Selling Price (per Quintal)</label>

<input
type="number"
step="0.01"
name="price"
class="form-control"
required>

</div>

<button
class="btn btn-success">

Calculate

</button>

</form>

</div>

</div>

</div>

{% endblock %}
