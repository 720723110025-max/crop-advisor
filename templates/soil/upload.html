{% extends "base.html" %}

{% block title %}
AI Soil Analysis
{% endblock %}

{% block content %}

<div class="container mt-5">

<div class="card shadow">

<div class="card-header bg-success text-white">

<h3>🌱 AI Soil Analysis</h3>

</div>

<div class="card-body">

<form
method="POST"
enctype="multipart/form-data">

<div class="row">

<div class="col-md-6 mb-3">

<label>Upload Soil Image</label>

<input
type="file"
name="soil_image"
class="form-control"
required>

</div>

<div class="col-md-6 mb-3">

<label>Soil Type</label>

<select
name="soil_type"
class="form-select">

<option>Black Soil</option>

<option>Red Soil</option>

<option>Clay Soil</option>

<option>Loamy Soil</option>

<option>Sandy Soil</option>

</select>

</div>

<div class="col-md-3 mb-3">

<label>pH</label>

<input
type="number"
step="0.1"
name="ph"
class="form-control"
required>

</div>

<div class="col-md-3 mb-3">

<label>Nitrogen (N)</label>

<input
type="number"
name="nitrogen"
class="form-control"
required>

</div>

<div class="col-md-3 mb-3">

<label>Phosphorus (P)</label>

<input
type="number"
name="phosphorus"
class="form-control"
required>

</div>

<div class="col-md-3 mb-3">

<label>Potassium (K)</label>

<input
type="number"
name="potassium"
class="form-control"
required>

</div>

</div>

<button
type="submit"
class="btn btn-success">

🌱 Analyze Soil

</button>

<a
href="{{ url_for('soil.index') }}"
class="btn btn-secondary">

View Reports

</a>

</form>

</div>

</div>

</div>

{% endblock %}
