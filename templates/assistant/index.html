{% extends "base.html" %}

{% block title %}AI Farmer Assistant{% endblock %}

{% block content %}

<div class="container mt-5">

<div class="card shadow-lg">

<div class="card-header bg-success text-white">

<h2>🤖 AI Farmer Assistant</h2>

<p class="mb-0">

Ask anything about crops, diseases, fertilizer, irrigation or farming.

</p>

</div>

<div class="card-body">

<div class="mb-3">

<label class="form-label">

Ask Your Question

</label>

<textarea

id="question"

class="form-control"

rows="4"

placeholder="Example: Which crop is suitable for black soil in Tamil Nadu?">

</textarea>

</div>

<div class="d-grid">

<button

id="askBtn"

class="btn btn-success">

🤖 Ask AI

</button>

</div>

<div

id="loading"

class="text-center mt-4"

style="display:none;">

<div class="spinner-border text-success"></div>

<p class="mt-2">

Thinking...

</p>

</div>

<div

id="answerCard"

class="card mt-4"

style="display:none;">

<div class="card-header bg-primary text-white">

AI Response

</div>

<div class="card-body">

<p id="answer"></p>

</div>

</div>

</div>

</div>

</div>

<script>

document.getElementById("askBtn").addEventListener(

"click",

async function(){

const question = document.getElementById("question").value.trim();

if(question===""){

alert("Please enter a question.");

return;

}

document.getElementById("loading").style.display="block";

document.getElementById("answerCard").style.display="none";

const form = new FormData();

form.append("question",question);

try{

const response = await fetch(

"/assistant/ask",

{

method:"POST",

body:form

}

);

const data = await response.json();

document.getElementById("loading").style.display="none";

document.getElementById("answerCard").style.display="block";

if(data.success){

document.getElementById("answer").innerText=data.answer;

}

else{

document.getElementById("answer").innerText=data.error;

}

}

catch(error){

document.getElementById("loading").style.display="none";

document.getElementById("answerCard").style.display="block";

document.getElementById("answer").innerText=

"Unable to connect to AI service.";

}

}

);

</script>

{% endblock %}
