{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

<h2>Experts</h2>

<a href="/admin/add-expert"
class="btn btn-success mb-3">
Add Expert
</a>

<table class="table table-bordered">

<tr>

<th>Name</th>

<th>Email</th>

<th>District</th>

</tr>

{% for expert in experts %}

<tr>

<td>{{ expert.full_name }}</td>

<td>{{ expert.email }}</td>

<td>{{ expert.district }}</td>

</tr>

{% endfor %}

</table>

</div>

{% endblock %}
