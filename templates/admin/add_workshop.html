{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

<h2>Add Workshop</h2>

<form method="POST">

<div class="mb-3">

<label>Workshop Title</label>

<input
class="form-control"
name="title"
required>

</div>

<div class="mb-3">

<label>District</label>

<input
class="form-control"
name="district">

</div>

<div class="mb-3">

<label>Date</label>

<input
type="date"
class="form-control"
name="date">

</div>

<div class="mb-3">

<label>Time</label>

<input
type="time"
class="form-control"
name="time">

</div>

<div class="mb-3">

<label>Speaker</label>

<input
class="form-control"
name="speaker">

</div>

<button class="btn btn-success">

Create Workshop

</button>

</form>

</div>

{% endblock %}
