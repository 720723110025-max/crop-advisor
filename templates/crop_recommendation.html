{% extends "base.html" %}

{% block title %}Crop Recommendation{% endblock %}

{% block content %}

<div class="container py-5">

<div class="row justify-content-center">

<div class="col-lg-10">

<div class="card shadow-lg border-0">

<div class="card-header bg-success text-white text-center">

<h2>🌾 AI Crop Recommendation</h2>

<p>Enter Soil Details to Get Best Crop</p>

</div>

<div class="card-body">

<form id="cropForm">

<div class="row">

<div class="col-md-4 mb-3">

<label>Nitrogen (N)</label>

<input type="number" class="form-control" name="nitrogen" required>

</div>

<div class="col-md-4 mb-3">

<label>Phosphorus (P)</label>

<input type="number" class="form-control" name="phosphorus" required>

</div>

<div class="col-md-4 mb-3">

<label>Potassium (K)</label>

<input type="number" class="form-control" name="potassium" required>

</div>

<div class="col-md-4 mb-3">

<label>Temperature (°C)</label>

<input type="number" step="0.1" class="form-control" name="temperature" required>

</div>

<div class="col-md-4 mb-3">

<label>Humidity (%)</label>

<input type="number" step="0.1" class="form-control" name="humidity" required>

</div>

<div class="col-md-4 mb-3">

<label>pH</label>

<input type="number" step="0.1" class="form-control" name="ph" required>

</div>

<div class="col-md-12 mb-3">

<label>Rainfall (mm)</label>

<input type="number" step="0.1" class="form-control" name="rainfall" required>

</div>

</div>

<div class="d-grid">

<button class="btn btn-success btn-lg">

🌱 Predict Crop

</button>

</div>

</form>

<hr>

<div id="loading" class="text-center" style="display:none;">

<div class="spinner-border text-success"></div>

<p class="mt-3">Finding Best Crop...</p>

</div>

<div id="result" style="display:none;">

<div class="alert alert-success mt-4">

<h3>🌾 Recommended Crop</h3>

<h2 id="cropName"></h2>

<hr>

<h5>Confidence</h5>

<h3 id="confidence"></h3>

<hr>

<h5>Suggestions</h5>

<p id="suggestions"></p>

</div>

</div>

</div>

</div>

</div>

</div>

</div>

<script>

document.getElementById("cropForm").onsubmit=function(e){

e.preventDefault();

document.getElementById("loading").style.display="block";

document.getElementById("result").style.display="none";

let data=new FormData(this);

fetch("/crop/api/predict-crop",{

method:"POST",

body:data

})

.then(res=>res.json())

.then(data=>{

document.getElementById("loading").style.display="none";

document.getElementById("result").style.display="block";

document.getElementById("cropName").innerHTML=data.crop;

document.getElementById("confidence").innerHTML=(data.confidence*100).toFixed(1)+"%";

document.getElementById("suggestions").innerHTML=data.suggestions;

});

}

</script>

{% endblock %}
