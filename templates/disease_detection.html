{% extends "base.html" %}

{% block title %}Disease Detection{% endblock %}

{% block content %}

<div class="container py-5">

<div class="row justify-content-center">

<div class="col-lg-8">

<div class="card shadow-lg border-0">

<div class="card-header bg-success text-white text-center">

<h2>🦠 AI Disease Detection</h2>

<p class="mb-0">
Upload a crop leaf image to detect diseases
</p>

</div>

<div class="card-body">

<form id="uploadForm"
      enctype="multipart/form-data">

<div class="mb-4">

<label class="form-label">

Select Leaf Image

</label>

<input
type="file"
class="form-control"
id="image"
name="image"
accept="image/*"
onchange="previewImage(event)"
required>

</div>

<div class="text-center mb-4">

<img
id="preview"
src=""
style="display:none;max-width:300px;border-radius:15px;"
class="shadow">

</div>

<div class="d-grid">

<button
type="submit"
class="btn btn-success btn-lg">

🔍 Detect Disease

</button>

</div>

</form>

<hr>

<div id="loading"
style="display:none"
class="text-center">

<div class="spinner-border text-success"></div>

<p class="mt-3">

Analyzing Image...

</p>

</div>

<div
id="result"
style="display:none">

<div class="alert alert-success mt-4">

<h3>

Disease

</h3>

<h4 id="diseaseName"></h4>

<hr>

<h5>

Confidence

</h5>

<h3 id="confidence"></h3>

<hr>

<h5>

Treatment

</h5>

<p id="treatment"></p>

</div>

</div>

</div>

</div>

</div>

</div>

</div>

<script>

function previewImage(event){

const img=document.getElementById("preview");

img.src=URL.createObjectURL(event.target.files[0]);

img.style.display="block";

}

document.getElementById("uploadForm").onsubmit=function(e){

e.preventDefault();

document.getElementById("loading").style.display="block";

document.getElementById("result").style.display="none";

let formData=new FormData(this);

fetch("/disease/api/detect",{

method:"POST",

body:formData

})

.then(res=>res.json())

.then(data=>{

document.getElementById("loading").style.display="none";

document.getElementById("result").style.display="block";

document.getElementById("diseaseName").innerHTML=data.disease;

document.getElementById("confidence").innerHTML=data.confidence+"%";

document.getElementById("treatment").innerHTML=data.treatment;

});

}

</script>

{% endblock %}
