{% extends "base.html" %}

{% block title %}
Settings
{% endblock %}

{% block content %}

<div class="container mt-5">

<div class="card shadow">

<div class="card-header bg-success text-white">

<h3>

⚙️ Profile Settings

</h3>

</div>

<div class="card-body">

<form method="POST">

<div class="mb-3">

<label>Full Name</label>

<input
type="text"
name="full_name"
value="{{ current_user.full_name }}"
class="form-control">

</div>

<div class="mb-3">

<label>Email</label>

<input
type="email"
value="{{ current_user.email }}"
class="form-control"
readonly>

</div>

<div class="mb-3">

<label>Phone</label>

<input
type="text"
name="phone"
value="{{ current_user.phone }}"
class="form-control">

</div>

<div class="mb-3">

<label>Language</label>

<select
name="language"
class="form-select">

<option value="en">English</option>

<option value="od">Odia</option>

</select>

</div>

<button
class="btn btn-success">

Save Changes

</button>

</form>

</div>

</div>

</div>

{% endblock %}
