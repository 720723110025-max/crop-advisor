{% extends "base.html" %}

{% block title %}
Notifications
{% endblock %}

{% block content %}

<div class="container mt-5">

<h2 class="text-success">

🔔 Smart Notifications

</h2>

{% for item in notifications %}

<div class="card shadow mb-3">

<div class="card-body">

<h5>

{{ item.title }}

</h5>

<p>

{{ item.message }}

</p>

</div>

</div>

{% endfor %}

</div>

{% endblock %}
