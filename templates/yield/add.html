{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

<div class="card shadow">

<div class="card-header bg-success text-white">

<h3>Add Yield Record</h3>

</div>

<div class="card-body">

<form method="POST">

<div class="mb-3">

<label>Crop</label>

<input
name="crop"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Yield (Quintals)</label>

<input
type="number"
step="0.01"
name="quantity"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Selling Price (₹)</label>

<input
type="number"
step="0.01"
name="price"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Total Expenses (₹)</label>

<input
type="number"
step="0.01"
name="expense"
class="form-control"
required>

</div>

<button class="btn btn-success">

Save

</button>

</form>

</div>

</div>

</div>

{% endblock %}
