{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

<div class="card shadow">

<div class="card-header bg-success text-white">

<h3>Create Workshop</h3>

</div>

<div class="card-body">

<form method="POST">

<div class="row">

<div class="col-md-6 mb-3">

<label>Workshop Title</label>

<input name="title" class="form-control">

</div>

<div class="col-md-6 mb-3">

<label>District</label>

<input name="district" class="form-control">

</div>

<div class="col-md-6 mb-3">

<label>Date</label>

<input
type="date"
name="date"
class="form-control">

</div>

<div class="col-md-6 mb-3">

<label>Time</label>

<input
type="time"
name="time"
class="form-control">

</div>

<div class="col-md-6 mb-3">

<label>Mode</label>

<select
name="mode"
class="form-select">

<option>Offline</option>

<option>Online</option>

</select>

</div>

<div class="col-md-6 mb-3">

<label>Location / Meeting Link</label>

<input
name="location"
class="form-control">

</div>

<div class="col-md-6 mb-3">

<label>Speaker</label>

<input
name="speaker"
class="form-control">

</div>

<div class="col-md-6 mb-3">

<label>Capacity</label>

<input
type="number"
name="capacity"
class="form-control">

</div>

<div class="col-md-12 mb-3">

<label>Description</label>

<textarea
name="description"
rows="5"
class="form-control"></textarea>

</div>

<div class="col-md-12 mb-3">

<label>PDF Resource Link</label>

<input
name="resource"
class="form-control">

</div>

</div>

<button class="btn btn-success">

Create Workshop

</button>

</form>

</div>

</div>

</div>

{% endblock %}
