{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

<div class="card shadow">

<div class="card-header bg-danger text-white">

<h3>

Disease Analysis

</h3>

</div>

<div class="card-body">

<img

src="{{ url_for('static',filename='uploads/'+image) }}"

class="img-fluid rounded mb-4">

<table class="table table-bordered">

<tr>

<th>Disease</th>

<td>{{ result.disease }}</td>

</tr>

<tr>

<th>Confidence</th>

<td>{{ result.confidence }}</td>

</tr>

<tr>

<th>Organic Remedy</th>

<td>{{ result.organic }}</td>

</tr>

<tr>

<th>Chemical Remedy</th>

<td>{{ result.chemical }}</td>

</tr>

<tr>

<th>Prevention</th>

<td>{{ result.prevention }}</td>

</tr>

</table>

<a

href="{{ url_for('disease_ai.index') }}"

class="btn btn-success">

Analyze Another

</a>

</div>

</div>

</div>

{% endblock %}
