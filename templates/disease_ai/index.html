{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

<div class="card shadow">

<div class="card-header bg-danger text-white">

<h3>

🦠 AI Disease Detection

</h3>

</div>

<div class="card-body">

<form

method="POST"

action="{{ url_for('disease_ai.predict') }}"

enctype="multipart/form-data">

<label>

Upload Crop Leaf Image

</label>

<input

type="file"

class="form-control"

name="crop_image"

required>

<br>

<button

class="btn btn-danger">

Detect Disease

</button>

</form>

</div>

</div>

</div>

{% endblock %}
