{% extends "base.html" %}

{% block title %}Smart Irrigation{% endblock %}

{% block content %}

<div class="container py-5">

<div class="row justify-content-center">

<div class="col-lg-9">

<div class="card shadow-lg border-0">

<div class="card-header bg-info text-white text-center">

<h2>💧 Smart Irrigation Advisor</h2>

<p class="mb-0">

AI Powered Irrigation Recommendation

</p>

</div>

<div class="card-body">

<form id="irrigationForm">

<div class="row">

<div class="col-md-6 mb-3">

<label>Crop Type</label>

<input
type="text"
name="crop_type"
class="form-control"
required>

</div>

<div class="col-md-6 mb-3">

<label>Soil Moisture (%)</label>

<input
type="number"
name="soil_moisture"
class="form-control"
required>

</div>

<div class="col-md-4 mb-3">

<label>Temperature (°C)</label>

<input
type="number"
name="temperature"
class="form-control"
required>

</div>

<div class="col-md-4 mb-3">

<label>Humidity (%)</label>

<input
type="number"
name="humidity"
class="form-control"
required>

</div>

<div class="col-md-4 mb-3">

<label>Rainfall (mm)</label>

<input
type="number"
name="rainfall"
class="form-control"
required>

</div>

</div>

<div class="d-grid">

<button class="btn btn-info btn-lg text-white">

💧 Get Irrigation Advice

</button>

</div>

</form>

<hr>

<div id="loading"
style="display:none"
class="text-center">

<div class="spinner-border text-info"></div>

<p class="mt-3">

Analyzing...

</p>

</div>

<div id="result"
style="display:none">

<div class="alert alert-success mt-4">

<h3>

💧 Irrigation Recommendation

</h3>

<hr>

<h5>

Water Required

</h5>

<h3 id="water"></h3>

<hr>

<h5>

Method

</h5>

<p id="method"></p>

<hr>

<h5>

Duration

</h5>

<p id="duration"></p>

<hr>

<h5>

Timing

</h5>

<p id="timing"></p>

<hr>

<h5>

Notes

</h5>

<p id="notes"></p>

</div>

</div>

</div>

</div>

</div>

</div>

</div>

<script>

document.getElementById("irrigationForm").onsubmit=function(e){

e.preventDefault();

document.getElementById("loading").style.display="block";

document.getElementById("result").style.display="none";

let formData=new FormData(this);

fetch("/irrigation/api/irrigation-advice",{

method:"POST",

body:formData

})

.then(r=>r.json())

.then(data=>{

document.getElementById("loading").style.display="none";

document.getElementById("result").style.display="block";

document.getElementById("water").innerHTML=data.water_requirement+" L";

document.getElementById("method").innerHTML=data.method;

document.getElementById("duration").innerHTML=data.duration+" Hours";

document.getElementById("timing").innerHTML=data.timing;

document.getElementById("notes").innerHTML=data.notes;

});

}

</script>

{% endblock %}
